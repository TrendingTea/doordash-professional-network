<!doctype html><html><head><link rel="stylesheet" href="/static/app.css"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Merchant</title></head><body><main class="wrap"><a href="/">← Home</a><h1>Merchant pickup feedback</h1><p>Choose a recent pickup. Feedback should take under 15 seconds.</p><div class="grid">{% for d in deliveries %}<a class="card" href="/merchant/feedback/{{d.id}}"><b>{{d.merchant_name}} · {{d.location_name}}</b><br>{{d.display_name}}<br><small>{{d.external_order_ref}}</small></a>{% else %}<p>No unrated deliveries.</p>{% endfor %}</div></main></body></html>
